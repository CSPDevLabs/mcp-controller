services:
  mcp-controller:
    build: .
    # Use the host network so the container can reach KIND at 127.0.0.1:35691.
    # With host networking the ports mapping is a no-op; the app binds directly
    # on the host interface at MCP_PORT.
    network_mode: host
    # entrypoint: /app/entrypoint.sh
    environment:
      MCP_PORT: "8088"
      MCP_HOST: "0.0.0.0"
      KUBECONFIG: "/root/.kube/config"
      # MCP_MOCK: "true"
      # MCP_MOCK_DATA_RECORD: "true"
      MCP_MOCK_DATA_DIR: "/app/tests/mocks/data"
    # ports:
    #   - "8088:8088"
    volumes:
      - "${HOME}/.kube/config:/root/.kube/config:ro"
      # - "./tests/mocks/data:/app/tests/mocks/data:rw" # For mock data recording
      - "./tests/mocks/data:/app/tests/mocks/data:ro" # For mock data playback

